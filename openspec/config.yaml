schema: spec-driven-with-adr

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Язык: русский (ru-RU)
  Все артефакты должны быть написаны на русском языке.

  Описание проекта, существующие сервисы и порядок взаимодействия между ними,
  а также существующие архитектурные решения описаны в папке `openspec/context`.

# Per-artifact rules
rules:
  proposal:
    - Используется только "бизнес"-описание, без технических деталей
  specs:
    - Используй "бизнес" термины, без технических деталей
  design:
    - Используется только "техническое" описание, без бизнес-описания и максимально кратко
    - Перед созданием артефакта, обязательно прочитай openspec/context/03-architecture.md и openspec/context/04-engineering-standards.md
    - При проектировании design.md обязательно указывай сервисы, в которых будет доработки. Описание сервисов находится в openspec/context/08-services.md